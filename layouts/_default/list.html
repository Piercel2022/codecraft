<div class="posts">
    {{ range .Pages }}
      <article>
        <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
        
        <!-- Add this block to display images -->
        {{ with .Resources.GetMatch "*.png" }}
          <img src="{{ .RelPermalink }}" alt="{{ $.Title }}" />
        {{ end }}
        
        <div class="summary">
          {{ .Summary }}
        </div>
        <a href="{{ .RelPermalink }}">Read More...</a>
      </article>
    {{ end }}
  </div>
